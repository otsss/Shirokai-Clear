name: Publicar pre-release validada
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag da pre-release
        required: true
        default: v1.0.0
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon build
      - name: Publicar JAR apos build e testes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test "$RELEASE_TAG" = v1.0.0
          (cd build/libs && sha256sum Shirokai-Clear-1.0.0.jar > Shirokai-Clear-1.0.0.jar.sha256)
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft --prerelease --title 'Shirokai Clear 1.0.0 — pré-release' --notes-file docs/release-v1.0.0.md
          fi
          gh release upload "$RELEASE_TAG" build/libs/Shirokai-Clear-1.0.0.jar build/libs/Shirokai-Clear-1.0.0-sources.jar build/libs/Shirokai-Clear-1.0.0.jar.sha256 --clobber
          gh release edit "$RELEASE_TAG" --target "$GITHUB_SHA" --notes-file docs/release-v1.0.0.md --draft=false --prerelease
